<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AnyLearn · 通学万义</title>
<meta name="description" content="AnyLearn 通学万义 —— 浏览器内真跑代码的编程教程，会记笔记、按艾宾浩斯曲线安排复习">
<meta name="theme-color" content="#0a0c11">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🦉</text></svg>">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- ===================== 登录门 ===================== -->
<div class="gate" id="gate">
  <div class="gate-box">
    <div class="gate-logo">🦉</div>
    <h1>AnyLearn</h1>
    <p class="slogan">通学万义</p>
    <p class="tagline" id="g-tagline"></p>

    <div class="gate-feats">
      <span class="gate-feat">代码现场运行</span>
      <span class="gate-feat">艾宾浩斯复习</span>
      <span class="gate-feat">跨设备同步</span>
      <span class="gate-feat">节奏守护</span>
    </div>

    <div class="gate-card">
      <h2 id="g-title"></h2>
      <p id="g-desc"></p>

      <div class="gate-note" id="g-note"></div>

      <h3 style="font-size:13.5px;margin:0 0 8px" id="g-steps-title"></h3>
      <ol class="gate-steps" id="g-steps"></ol>

      <input type="text" id="g-token" autocomplete="off" spellcheck="false" autocapitalize="off">
      <div class="gate-err" id="g-err"></div>
      <button class="primary-btn" id="g-submit"></button>
    </div>

    <p class="gate-foot" id="g-foot"></p>
    <p class="gate-lang"><a href="../en/">English →</a></p>
  </div>
</div>

<!-- ===================== 主应用 ===================== -->
<div id="app" hidden>

  <header class="topbar">
    <button class="icon-btn" id="btn-menu" aria-label="目录">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="brand" id="btn-home">
      <span class="logo">🦉</span>
      <span class="title">AnyLearn<small>通学万义</small></span>
    </div>
    <div class="topbar-right">
      <div class="sync-pill" id="sync-pill" data-state="off">
        <span class="dot"></span><span class="sync-text">未连接</span>
      </div>
      <button class="user-chip" id="btn-settings">
        <img class="avatar" id="avatar" alt="" hidden>
        <span id="username"></span>
        <svg viewBox="0 0 24 24" style="width:15px;height:15px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="progress-row">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <span class="progress-label" id="progress-label"></span>
    </div>
    <nav class="toc" id="toc"><div class="loading">加载目录…</div></nav>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main" id="main">
    <article class="lesson" id="lesson"><div class="loading">加载中…</div></article>
    <nav class="lesson-nav" id="lesson-nav"></nav>
  </main>

  <section class="notes" id="notes">
    <div class="notes-head">
      <span class="notes-title">📝 本节笔记</span>
      <div class="notes-actions">
        <button class="mini-btn active" id="btn-note-preview">预览</button>
        <button class="mini-btn" id="btn-note-edit">编辑</button>
        <button class="mini-btn danger" id="btn-note-clear">清空</button>
      </div>
    </div>
    <textarea class="note-input" id="note-input" hidden></textarea>
    <div class="note-preview markdown" id="note-preview"></div>
    <div class="notes-foot">
      <span id="note-status"></span>
      <button class="mini-btn" id="btn-note-sync">立即同步</button>
    </div>
  </section>

  <button class="note-fab" id="note-fab" aria-label="笔记">📝</button>

  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="icon-btn" id="btn-modal-close">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>

<script>window.AL_CONFIG = { lang: 'zh', content: '../content/zh' };</script>
<script src="../i18n/zh.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/markdown.js"></script>
<script src="../js/github-api.js"></script>
<script src="../js/config-sync.js"></script>
<script src="../js/godbolt.js"></script>
<script src="../js/runner.js"></script>
<script src="../js/codeblock.js"></script>
<script src="../js/quiz.js"></script>
<script src="../js/review.js"></script>
<script src="../js/guardian.js"></script>
<script src="../js/notes.js"></script>
<script src="../js/gate.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
